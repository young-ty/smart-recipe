# 前端静态站点与 API 反向代理（容器化部署，见 docs/容器化部署.md）。
#
# 浏览器只访问一个源（http://localhost:5173），/api 由这里转到 backend:8000。
# 好处是容器里不需要 CORS，也不用给前端注入 VITE_API_BASE_URL，
# 并且 localStorage 里的菜谱记忆继续按 5173 这个 origin 隔离，和本机跑法一致。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端单张图上限 5 MB，超出会返回结构化错误体；前端上传前还会先在浏览器里压缩。
    # nginx 默认只收 1 MB，不改这条的话大图会先被 nginx 挡掉，
    # 用户看到的是 nginx 的 413 页面，而不是后端的错误提示。
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 库外菜要现调大模型，后端自己的超时是 20 秒，代理不能比它先放弃
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
