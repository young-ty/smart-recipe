# 统一测试入口：在仓库根目录执行 `pytest` 即可跑完文档契约测试与后端接口测试
#
#   .venv\Scripts\python.exe -m pytest            # 全部
#   python -m unittest discover -s tests -t .     # 仅仓库级文档/契约测试（无需第三方依赖）
#   .venv\Scripts\python.exe -m pytest --cov    # 带覆盖率（口径见 .coveragerc，NFR-06）
#
# backend/tests 不设为包，避免与根目录 tests 包同名冲突
[pytest]
testpaths = tests backend/tests
python_files = test_*.py